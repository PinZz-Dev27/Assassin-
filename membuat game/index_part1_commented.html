<!-- Deklarasi tipe dokumen untuk standar HTML5 -->
<!DOCTYPE html>
<!-- Elemen root HTML yang membungkus seluruh dokumen dengan bahasa Indonesia -->
<html lang="id">

<!-- Bagian head dokumen yang memuat metadata, judul halaman, dan gaya CSS internal -->
<head>
    <!-- Pengaturan set karakter dokumen menggunakan UTF-8 agar mendukung berbagai simbol -->
    <meta charset="UTF-8">
    <!-- Konfigurasi viewport agar antarmuka responsif dan sesuai dengan skala layar perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Judul halaman web yang akan muncul pada tab peramban/browser -->
    <title>Speed Assassin - Florence Guild HQ</title>
    <!-- Tag pembuka style CSS internal untuk menata seluruh tampilan dan antarmuka -->
    <style>
        /* Mengimpor font eksternal dari Google Fonts: Cinzel (gaya gothic/klasik), Nunito (modern), dan Rajdhani (futuristik) */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Nunito:wght@600;800;900&family=Rajdhani:wght@500;700;900&display=swap');

        /* Definisi variabel CSS global (:root) untuk konsistensi warna tema game di seluruh elemen */
        :root {
            /* Warna khas karakter ninja (kuning terang) */
            --ninja-color: #facc15;
            /* Warna latar belakang utama bernuansa sangat gelap */
            --dark-bg: #030712;
            /* Warna latar belakang panel dengan transparansi */
            --panel-bg: rgba(10, 15, 26, 0.78);
            /* Warna border keemasan dengan tingkat opasitas halus */
            --border-color: rgba(212, 175, 55, 0.28);
            /* Warna aksen emas utama */
            --accent-gold: #f59e0b;
            /* Warna kilau/glow aksen emas cerah */
            --accent-glow: #facc15;
            /* Warna emas terang untuk efek pencahayaan */
            --gold-bright: #ffd269;
            /* Warna emas gelap untuk aksen sekunder dan batas */
            --gold-dark: #b45309;
            /* Warna biru khas kastil Florence */
            --florence-blue: #1e293b;
        }

        /* SCROLLBAR GELAP */
        /* Mengatur ukuran lebar bilah gulir (scrollbar) kustom pada peramban berbasis WebKit */
        ::-webkit-scrollbar {
            /* Lebar scrollbar vertikal */
            width: 8px;
        }

        /* Mengatur tampilan lintasan (track) scrollbar */
        ::-webkit-scrollbar-track {
            /* Warna latar belakang lintasan scrollbar */
            background: #080d1a;
        }

        /* Mengatur tampilan tuas geser (thumb) scrollbar */
        ::-webkit-scrollbar-thumb {
            /* Warna pegangan tuas scrollbar */
            background: #334155;
            /* Sudut melengkung pada tuas scrollbar */
            border-radius: 10px;
        }

        /* Efek interaktif saat kursor melayang di atas tuas scrollbar */
        ::-webkit-scrollbar-thumb:hover {
            /* Mengubah warna tuas menjadi warna emas saat diarahkan kursor */
            background: var(--accent-gold);
        }

        /* Pengaturan universal untuk seluruh elemen HTML di halaman */
        * {
            /* Memasukkan padding dan border ke dalam perhitungan total lebar/tinggi elemen */
            box-sizing: border-box;
            /* Mencegah seleksi teks secara tidak sengaja oleh pemain saat bermain */
            user-select: none;
        }

        /* Pengaturan gaya untuk badan dokumen (body) */
        body {
            /* Menghilangkan margin bawaan browser */
            margin: 0;
            /* Menghilangkan padding bawaan browser */
            padding: 0;
            /* Menentukan jenis font utama keluarga Nunito dengan fallback sans-serif */
            font-family: 'Nunito', sans-serif;
            /* Latar belakang gelap pekat */
            background: #020409;
            /* Membatasi tinggi pas satu viewport layar penuh */
            height: 100vh;
            /* Membatasi lebar pas satu viewport layar penuh */
            width: 100vw;
            /* Mencegah bilah gulir muncul di luar area yang diinginkan */
            overflow: hidden;
            /* Warna teks standar (abu-abu sangat terang mendekati putih) */
            color: #f8fafc;
            /* Posisi relatif sebagai acuan elemen absolute di dalamnya */
            position: relative;
        }

        /* ================= LOBBY BACKGROUND & SCENE ================= */
        /* Kontainer tampilan viewport latar belakang lobi utama */
        .lobby-viewport {
            /* Posisi tetap memenuhi seluruh layar */
            position: fixed;
            /* Menempel ke tepi atas */
            top: 0;
            /* Menempel ke tepi kiri */
            left: 0;
            /* Lebar 100% dari lebar layar viewport */
            width: 100vw;
            /* Tinggi 100% dari tinggi layar viewport */
            height: 100vh;
            /* Menyembunyikan bagian yang meluap dari batas layar */
            overflow: hidden;
            /* Indeks tumpukan lapisan paling dasar */
            z-index: 0;
            /* Warna dasar gelap */
            background: #020409;
        }

        /* Container with exact aspect ratio of background lobby.png (1697 x 927 = 1.8306) */
        /* Kontainer adegan lobi dengan rasio aspek presisi gambar latar */
        .lobby-scene {
            /* Posisi absolut terhadap viewport lobi */
            position: absolute;
            /* Berada di tengah sumbu horizontal */
            left: 50%;
            /* Berada di tengah sumbu vertikal */
            top: 50%;
            /* Transformasi pergeseran mundur 50% untuk penengahan presisi */
            transform: translate(-50%, -50%);
            /* Lebar responsif mempertahankan rasio aspek gambar */
            width: max(100vw, calc(100vh * 1.830636));
            /* Tinggi responsif mempertahankan rasio aspek gambar */
            height: max(100vh, calc(100vw / 1.830636));
            /* Menonaktifkan interaksi klik/pointer agar tembus ke elemen di baliknya */
            pointer-events: none;
        }

        /* Gambar elemen latar belakang pemandangan lobi */
        .lobby-bg-img {
            /* Posisi absolut di pojok kiri atas scene */
            position: absolute;
            /* Menempel di bagian atas */
            top: 0;
            /* Menempel di bagian kiri */
            left: 0;
            /* Lebar mengisi kontainer */
            width: 100%;
            /* Tinggi mengisi kontainer */
            height: 100%;
            /* Ditampilkan sebagai elemen blok */
            display: block;
            /* Mengisi ruang kontainer secara penuh */
            object-fit: fill;
        }

        /* VOLUMETRIC SPOTLIGHT BEAM CONE (Emanating from clocktower lamp at 50% X, 23.4% Y down to 72% Y) */
        /* Efek visual berkas cahaya kerucut volumetrik dari lentera menara jam */
        .volumetric-spotlight {
            /* Posisi absolut dalam koordinat scene */
            position: absolute;
            /* Titik awal vertikal di posisi 23.4% */
            top: 23.4%;
            /* Titik awal horizontal di posisi tengah */
            left: 50%;
            /* Penyesuaian agar titik tengah berkas pas di sumbu X */
            transform: translateX(-50%);
            /* Lebar pancaran berkas cahaya */
            width: 58%;
            /* Tinggi pancaran berkas cahaya */
            height: 48.5%;
            /* Gradasi radial untuk efek pendaran cahaya dari sumber ke lantai */
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 230, 140, 0.32) 0%, rgba(255, 205, 85, 0.14) 38%, rgba(255, 180, 50, 0.03) 72%, transparent 85%);
            /* Pemotongan bentuk kerucut trapesium menggunakan poligon */
            clip-path: polygon(48.6% 0%, 51.4% 0%, 75% 100%, 25% 100%);
            /* Cahaya tidak menghalangi klik mouse */
            pointer-events: none;
            /* Efek blending layar agar cahaya menyatu cerah dengan latar */
            mix-blend-mode: screen;
            /* Animasi kedip berkilau halus terus-menerus */
            animation: beamShimmer 5s ease-in-out infinite alternate;
            /* Lapisan di atas latar lobi */
            z-index: 2;
        }

        /* Keyframes untuk animasi kilau dan fluktuasi intensitas berkas cahaya */
        @keyframes beamShimmer {
            /* Kondisi awal intensitas opasitas cahaya */
            0% { opacity: 0.82; }
            /* Kondisi puncak intensitas opasitas cahaya */
            100% { opacity: 1; }
        }

        /* FLOATING DUST MOTES INSIDE SPOTLIGHT */
        /* Kontainer partikel debu melayang di dalam sorotan lampu */
        .dust-container {
            /* Posisi absolut dalam scene */
            position: absolute;
            /* Jarak dari atas */
            top: 25%;
            /* Jarak dari kiri */
            left: 36%;
            /* Lebar kontainer partikel */
            width: 28%;
            /* Tinggi kontainer partikel */
            height: 45%;
            /* Tidak menangkap interaksi kursor mouse */
            pointer-events: none;
            /* Lapisan di atas berkas cahaya */
            z-index: 3;
            /* Menyembunyikan partikel yang bergerak ke luar batas */
            overflow: hidden;
        }

        /* Partikel butiran debu individual yang bersinar */
        .mote {
            /* Posisi absolut di dalam dust-container */
            position: absolute;
            /* Bentuk lingkaran sempurna */
            border-radius: 50%;
            /* Warna partikel debu kekuningan semi-transparan */
            background: rgba(255, 235, 160, 0.9);
            /* Efek pendaran cahaya di sekeliling butiran debu */
            box-shadow: 0 0 8px rgba(255, 220, 120, 0.9);
            /* Animasi pergerakan melayang ke atas tanpa henti */
            animation: moteFloat linear infinite;
        }

        /* Keyframes pergerakan melayang dan fading partikel debu */
        @keyframes moteFloat {
            /* Posisi awal di bagian bawah kontainer dengan transparansi penuh */
            0% {
                transform: translateY(100%) translateX(0);
                opacity: 0;
            }
            /* Partikel mulai terlihat jelas saat naik */
            15% {
                opacity: 0.8;
            }
            /* Partikel tetap terlihat sebagian besar waktu */
            85% {
                opacity: 0.7;
            }
            /* Partikel menghilang perlahan di bagian atas sambil bergeser ke kanan */
            100% {
                transform: translateY(-20%) translateX(25px);
                opacity: 0;
            }
        }

        /* ================= CHARACTER UNDER SPOTLIGHT ================= */
        /* Exact coordinates: lamp is at 50%, 23.4%; floor deck center is at 50%, 70.8% */
        /* Area panggung tempat karakter berdiri di bawah sorotan lampu */
        .character-stage {
            /* Posisi absolut di dalam scene */
            position: absolute;
            /* Posisi horizontal tengah */
            left: 50%;
            /* Posisi vertikal dekat lantai panggung */
            top: 73.8%;
            /* Penyesuaian pivot agar karakter bertumpu tepat di lantai */
            transform: translate(-50%, -100%);
            /* Tata letak fleksibel vertikal */
            display: flex;
            flex-direction: column;
            /* Penjajaran horizontal ke tengah */
            align-items: center;
            /* Mengunci posisi ke bagian bawah */
            justify-content: flex-end;
            /* Mengizinkan interaksi klik pada karakter */
            pointer-events: auto;
            /* Berada di atas lapisan cahaya dan latar */
            z-index: 5;
        }

        /* Pembungkus sprite dan elemen bayangan karakter */
        .character-wrapper {
            /* Posisi relatif sebagai kontainer elemen bayangan dan sprite */
            position: relative;
            /* Mengatur kontainer secara flex vertikal */
            display: flex;
            flex-direction: column;
            /* Pusatkan karakter secara horizontal */
            align-items: center;
        }

        /* AMBIENT FLOOR BOUNCE GLOW ON WOODEN DECK */
        /* Pendaran cahaya pantulan lantai kayu di bawah karakter */
        .floor-bounce-glow {
            /* Posisi absolut di dasar karakter */
            position: absolute;
            /* Posisi sedikit di bawah pijakan */
            bottom: -22px;
            /* Posisi tengah */
            left: 50%;
            /* Menengahkan sumbu horizontal */
            transform: translateX(-50%);
            /* Lebar area pantulan cahaya */
            width: 340px;
            /* Tinggi elips pantulan */
            height: 60px;
            /* Gradien radial cahaya emas lembut yang memudar ke tepi */
            background: radial-gradient(ellipse at center, rgba(255, 220, 120, 0.32) 0%, rgba(245, 158, 11, 0.12) 45%, transparent 75%);
            /* Bentuk elips melingkar */
            border-radius: 50%;
            /* Efek buram kabur agar pantulan terlihat sangat alami */
            filter: blur(12px);
            /* Lapisan paling dasar di bawah bayangan */
            z-index: 0;
            /* Tidak merespon interaksi kursor */
            pointer-events: none;
        }

        /* PERSPECTIVE CAST SHADOW ON WOODEN PLANKS */
        /* Bayangan jatuh dengan perspektif di atas lantai papan kayu */
        .cast-shadow {
            /* Posisi absolut */
            position: absolute;
            /* Posisi pas di bawah sepatu karakter */
            bottom: -15px;
            /* Berada di tengah */
            left: 50%;
            /* Menengahkan sumbu horizontal */
            transform: translateX(-50%);
            /* Lebar bayangan jatuh */
            width: 230px;
            /* Tinggi bayangan */
            height: 32px;
            /* Gradasi warna bayangan gelap transparan */
            background: radial-gradient(ellipse at center, rgba(10, 5, 2, 0.82) 0%, rgba(15, 8, 3, 0.45) 50%, transparent 80%);
            /* Bentuk elips */
            border-radius: 50%;
            /* Efek buram halus */
            filter: blur(6px);
            /* Lapisan di atas pantulan cahaya */
            z-index: 1;
            /* Tidak merespon klik mouse */
            pointer-events: none;
        }

        /* REALISTIC CONTACT OCCLUSION SHADOW (Directly touching the boot soles) */
        /* Bayangan oklusi kontak tajam tepat di titik sentuh sol sepatu */
        .contact-shadow {
            /* Posisi absolut */
            position: absolute;
            /* Jarak sangat rapat dengan sol sepatu */
            bottom: -7px;
            /* Berada di tengah */
            left: 50%;
            /* Penengahan horizontal */
            transform: translateX(-50%);
            /* Lebar area kontak sepatu */
            width: 160px;
            /* Tinggi elips kontak */
            height: 15px;
            /* Warna hitam pekat untuk oklusi bayangan rapat */
            background: radial-gradient(ellipse at center, rgba(4, 2, 1, 1) 0%, rgba(10, 5, 2, 0.9) 45%, transparent 75%);
            /* Bentuk elips */
            border-radius: 50%;
            /* Buram minimal agar tepi bayangan tetap tajam */
            filter: blur(1.5px);
            /* Lapisan tepat di bawah karakter */
            z-index: 2;
            /* Tidak merespon mouse */
            pointer-events: none;
        }

        /* ASSASSIN CHARACTER SPRITE */
        /* Sprite gambar karakter ninja pembunuh utama */
        #ninja-karakter {
            /* Lebar tampilan gambar sprite */
            width: 300px;
            /* Tinggi otomatis menyesuaikan proporsi gambar */
            height: auto;
            /* Elemen blok */
            display: block;
            /* Margin negatif bawah untuk menanam kaki karakter pas di lantai kayu */
            margin: 0 auto -9px auto; /* Compensate for transparent padding in sprite to plant boots on planks */
            /* Posisi relatif */
            position: relative;
            /* Lapisan di atas bayangan */
            z-index: 4;
            /* Titik tumpu transformasi di tengah bawah kaki */
            transform-origin: bottom center;
            /* Animasi pernapasan realistis halus */
            animation: realisticBreathing 3.6s ease-in-out infinite;
            /* Efek filter bayangan cahaya keemasan serta peningkatan kontras dan kejenuhan warna */
            filter: drop-shadow(0 -6px 12px rgba(255, 230, 130, 0.65))
                    drop-shadow(0 -1px 3px rgba(255, 245, 200, 0.9))
                    drop-shadow(0 3px 22px rgba(255, 190, 60, 0.35))
                    contrast(1.08) brightness(1.05) saturate(1.12);
            /* Transisi halus saat efek hover */
            transition: filter 0.3s ease, transform 0.2s ease;
            /* Kursor berupa pointer penunjuk saat didekati */
            cursor: pointer;
        }

        /* Efek saat kursor diarahkan ke atas karakter ninja */
        #ninja-karakter:hover {
            /* Peningkatan intensitas pendaran cahaya emas dan kontras saat disorot */
            filter: drop-shadow(0 -5px 14px rgba(255, 235, 160, 0.7))
                    drop-shadow(0 3px 25px rgba(255, 200, 70, 0.4))
                    contrast(1.1) brightness(1.08) saturate(1.15);
        }

        /* GROUNDED BREATHING ANIMATION (Feet stay 100% locked to floor) */
        /* Animasi pernapasan karakter di mana posisi kaki tetap menapak di lantai */
        @keyframes realisticBreathing {
            /* Siklus awal dan akhir pernapasan dengan skala normal */
            0%, 100% {
                transform: scale(1, 1);
            }
            /* Siklus puncak tarikan napas dada mengembang sedikit ke atas */
            50% {
                transform: scale(1.012, 1.018) translateY(-1px);
            }
        }

        /* Compatibility dummy pedestal for existing script references */
        /* Elemen pedestal panggung tersembunyi untuk menjaga kompatibilitas script lama */
        .ninja-pedestal {
            /* Disembunyikan dari tampilan visual */
            display: none;
        }

        /* ================= TOP NAVIGATION HUD ================= */
        /* Bilah navigasi HUD atas yang melayang di atas layar */
        .top-hud-bar {
            /* Posisi melayang tetap di atas layar */
            position: fixed;
            /* Menempel di bagian atas */
            top: 0;
            /* Menempel di tepi kiri */
            left: 0;
            /* Lebar memenuhi seluruh layar */
            width: 100%;
            /* Menghitung padding ke dalam lebar total */
            box-sizing: border-box;
            /* Jarak bantalan dalam bar */
            padding: 16px 36px;
            /* Menggunakan tata letak flexbox */
            display: flex;
            /* Memisahkan elemen kiri, tengah, dan kanan ke kedua ujung */
            justify-content: space-between;
            /* Penjajaran vertikal ke tengah */
            align-items: center;
            /* Tingkat lapisan tinggi di atas tampilan panggung */
            z-index: 40;
            /* Membiarkan klik mouse tembus di area kosong */
            pointer-events: none;
        }

        /* Bagian kiri bilah HUD atas (profil dan mata uang) */
        .top-hud-left {
            /* Tampilan flexbox */
            display: flex;
            /* Penjajaran vertikal rata tengah */
            align-items: center;
            /* Jarak antar elemen kartu profil dan kapsul koin */
            gap: 18px;
            /* Mengaktifkan interaksi klik kursor */
            pointer-events: auto;
        }

        /* PLAYER PROFILE CARD (ASSASSIN'S CREED STYLE) */
        /* Kartu profil pemain bergaya antarmuka Assassin's Creed */
        .player-profile-card {
            /* Latar gradien gelap semi-transparan */
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(6, 10, 20, 0.95));
            /* Garis tepi tipis keemasan */
            border: 1px solid rgba(212, 175, 55, 0.4);
            /* Aksen garis tebal emas di sisi kiri */
            border-left: 4px solid var(--accent-gold);
            /* Sudut kartu melengkung */
            border-radius: 14px;
            /* Bantalan ruang dalam kartu */
            padding: 8px 18px 8px 10px;
            /* Tata letak flexbox */
            display: flex;
            /* Penjajaran rata tengah */
            align-items: center;
            /* Jarak antara avatar dan teks informasi */
            gap: 14px;
            /* Bayangan gelap kartu dan highlight bagian dalam */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            /* Kursor berupa penunjuk klik */
            cursor: pointer;
            /* Transisi animasi halus saat hover */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Efek kaca buram pada latar belakang */
            backdrop-filter: blur(12px);
        }

        /* Efek hover saat kartu profil disorot mouse */
        .player-profile-card:hover {
            /* Mengangkat kartu 2 piksel ke atas */
            transform: translateY(-2px);
            /* Warna border emas terang saat disorot */
            border-color: var(--accent-gold);
            /* Bayangan bercahaya keemasan */
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.25);
        }

        /* Bingkai cincin melingkar untuk avatar pemain */
        .avatar-ring-frame {
            /* Posisi relatif */
            position: relative;
            /* Lebar bingkai avatar */
            width: 50px;
            /* Tinggi bingkai avatar */
            height: 50px;
            /* Bentuk lingkaran sempurna */
            border-radius: 50%;
            /* Garis tepi emas melingkar */
            border: 2px solid var(--accent-gold);
            /* Cahaya pendaran di sekeliling bingkai */
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
            /* Latar belakang gelap */
            background: #090e1a;
            /* Memotong gambar avatar yang keluar dari batas lingkaran */
            overflow: hidden;
            /* Mencegah bingkai avatar menyusut */
            flex-shrink: 0;
            /* Kontainer flex */
            display: flex;
            /* Penjajaran horizontal rata tengah */
            align-items: center;
            /* Penjajaran vertikal rata tengah */
            justify-content: center;
        }

        /* Gambar avatar pemain */
        #avatar-img {
            /* Lebar gambar avatar sedikit diperbesar */
            width: 110%;
            /* Tinggi gambar avatar */
            height: 110%;
            /* Menyesuaikan proporsi tanpa merusak aspek rasio */
            object-fit: cover;
            /* Mengatur fokus posisi gambar pada area atas kepala */
            object-position: center 20%;
            /* Skala perbesaran gambar */
            transform: scale(1.2);
        }

        /* Lencana indikator level pemain di pojok bingkai avatar */
        .avatar-level-badge {
            /* Posisi absolut menempel di sudut kanan bawah */
            position: absolute;
            bottom: -3px;
            right: -3px;
            /* Latar belakang emas pekat */
            background: #b45309;
            /* Warna teks putih */
            color: #fff;
            /* Garis tepi kuning terang */
            border: 1.5px solid #fcd34d;
            /* Bentuk bulat sempurna */
            border-radius: 50%;
            /* Lebar lencana */
            width: 18px;
            /* Tinggi lencana */
            height: 18px;
            /* Ukuran huruf angka level */
            font-size: 10px;
            /* Ketebalan font ekstra tebal */
            font-weight: 900;
            /* Tampilan flexbox */
            display: flex;
            /* Penjajaran horizontal dan vertikal ke tengah */
            align-items: center;
            justify-content: center;
            /* Jenis huruf Rajdhani */
            font-family: 'Rajdhani', sans-serif;
        }

        /* Kelompok teks informasi profil pemain */
        .profile-info-group {
            /* Tata letak fleksibel kolom vertikal */
            display: flex;
            flex-direction: column;
            /* Jarak tipis antar baris info */
            gap: 2px;
        }

        /* Baris nama pemain beserta ikon edit */
        .p-name-row {
            /* Tampilan flexbox horizontal */
            display: flex;
            /* Rata tengah secara vertikal */
            align-items: center;
            /* Jarak antara nama dan ikon edit */
            gap: 6px;
        }

        /* Teks nama pemain */
        .p-name {
            /* Font bergaya klasik Cinzel */
            font-family: 'Cinzel', serif;
            /* Ukuran font nama */
            font-size: 18px;
            /* Ketebalan huruf sangat tebal */
            font-weight: 800;
            /* Warna teks putih terang */
            color: #f8fafc;
            /* Jarak renggang antar huruf */
            letter-spacing: 1.5px;
            /* Menghilangkan margin bawaan */
            margin: 0;
            /* Bayangan teks agar terbaca jelas di atas latar */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Ikon pensil edit nama */
        .edit-badge {
            /* Ukuran simbol pensil */
            font-size: 13px;
            /* Warna emas aksen */
            color: var(--accent-gold);
            /* Transparansi normal */
            opacity: 0.8;

        /* Tombol menu aksi samping bergaya gothic */

/* MODAL DARK THEME */
        /* Lapisan overlay gelap latar belakang untuk seluruh jendela dialog modal pop-up */
        .modal-overlay {
            /* Sembunyi secara default sampai diaktifkan via JS */
            display: none;
            /* Melayang memenuhi seluruh layar */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(2, 6, 23, 0.9);

            align-items: center;

        /* Animasi munculnya kotak modal dengan efek pembesaran dan fade-in */
        @keyframes modalFade {
            /* Kondisi awal sedikit mengecil dan transparan */
            0% {
                transform: scale(0.95);
                opacity: 0;
            }

            /* Kondisi akhir skala normal dan sepenuhnya terlihat */
            100% {
                transform: scale(1);
                opacity: 1;
            }

            /* Warna latar abu-abu gelap kebiruan */
            background: #0f172a;

            padding: 30px;
            /* Sudut kotak membulat */
            border-radius: 20px;
            /* Rata tengah untuk konten teks */

            /* Lebar minimum kotak modal */
            min-width: 450px;
            /* Lebar maksimum kotak modal */

            /* Efek bayangan gelap di sekeliling kotak modal */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            /* Garis tepi abu-abu elegan */
            border: 1px solid #334155;
            /* Warna teks standar */
            color: #f8fafc;
            /* Batas tinggi maksimum 80% dari tinggi layar */
            max-height: 80vh;
            /* Bilah gulir vertikal otomatis jika konten panjang */

            /* Memicu animasi modalFade saat terbuka */

            position: relative;
            /* Lebar bingkai */
            width: 70px;
            /* Tinggi bingkai */
            height: 70px;
            /* Tata letak fleksibel */
            display: flex;
            /* Rata tengah horizontal dan vertikal */
            align-items: center;
            justify-content: center;
        }

        /* Cincin kilau kostum (dinonaktifkan secara paksa untuk tampilan minimalis) */
        .suit-glow-ring {
            display: none !important;
        }

        /* Bola orb lingkaran penampil warna tema kostum */
        .suit-orb {
            /* Lebar bola warna */
            width: 44px;
            /* Tinggi bola warna */
            height: 44px;
            /* Bentuk lingkaran sempurna */
            border-radius: 50%;
            /* Garis tepi abu-abu tegas tanpa bayangan berlebih */
            border: 2px solid #475569 !important;
            /* Menghilangkan efek box shadow bawaan */
            box-shadow: none !important;
            /* Lapisan di atas bingkai */
            z-index: 2;
        }
